name: Remote Builder

on:
  workflow_dispatch:

jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
      - name: Check Disk
        run: df -h
      - name: Start BuildKit
        run: |
          docker run -d \
            --name buildkit \
            --privileged \
            -p 127.0.0.1:1234:1234 \
            moby/buildkit:latest \
            --addr tcp://0.0.0.0:1234

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          docker run -d \
            --name cloudflared \
            --network host \
            cloudflare/cloudflared:latest \
            tunnel \
            --no-autoupdate \
            run \
            --token "$TUNNEL_TOKEN"
      - name: Keep builder alive
        run: |
          echo "Remote builder ready"
          sleep infinity