name: Remote Builder

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
      - name: Check Disk
        run: df -h

      - name: Start BuildKit
        run: |
          docker run -d \
            --name buildkit \
            --privileged \
            -p 127.0.0.1:1234:1234 \
            moby/buildkit:latest \
            --addr tcp://0.0.0.0:1234

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          docker run -d \
            --name cloudflared \
            --network host \
            cloudflare/cloudflared:latest \
            tunnel \
            --no-autoupdate \
            run \
            --token "$TUNNEL_TOKEN"
      - name: Keep builder alive
        run: |
          echo "Remote builder ready"
          sleep infinity

  restart:
    needs: builder
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch next workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          # Only renew an expired builder; setup failures must remain visible.
          jobs=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --url "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28")
          if ! jq -e 'any(.jobs[]; .name == "builder" and .conclusion == "timed_out")' <<< "$jobs" > /dev/null; then
            echo "Builder did not time out; skipping dispatch."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --request POST \
            --url "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/workflow.yml/dispatches" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$(jq -cn --arg ref "$WORKFLOW_REF" '{ref: $ref}')"
